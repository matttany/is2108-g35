<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Laundry bookings | DeLaundry{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <header class="bg-white border-bottom">
      <nav class="container py-3 d-flex flex-wrap align-items-center gap-3" aria-label="Customer navigation">
        <a class="fs-4 fw-bold text-decoration-none me-auto" href="{% url 'accounts:customer_home' %}">DeLaundry</a>
        <a href="{% url 'accounts:customer_home' %}">My account</a>
        <a href="{% url 'customerstorefront:order_list' %}">My orders</a>
        <a href="{% url 'customerstorefront:availability' %}">Pickup times</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="btn btn-outline-secondary" type="submit">Log out</button>
        </form>
      </nav>
    </header>
    {% include "bookings/demo_banner.html" %}
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
