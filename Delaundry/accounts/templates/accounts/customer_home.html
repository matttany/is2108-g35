{% extends "accounts/base.html" %}

{% block title %}Customer home | DeLaundry{% endblock %}

{% block content %}
  <h2>Welcome, {{ request.user.name }}</h2>
  <p>You are now logged in as a customer.</p> {# eventually link to customer profile #}

  <p><a href="{% url 'customerstorefront:availability' %}">Check laundry pickup times</a></p>

  <form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button class="btn btn-outline-secondary" type="submit">
      Log out
    </button>
  </form>
{% endblock %}
