<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Worker workspace | DeLaundry{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <header class="bg-white border-bottom">
      <nav class="container py-3 d-flex flex-wrap align-items-center gap-3" aria-label="Worker navigation">
        <a class="fs-4 fw-bold text-decoration-none me-auto" href="{% url 'accounts:worker_home' %}">DeLaundry</a>
        {% if user.is_authenticated and user.role == 'worker' %}
          <a href="{% url 'accounts:worker_home' %}">My account</a>
          <form method="post" action="{% url 'accounts:worker_logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-secondary" type="submit">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:worker_register' %}">Become a worker</a>
          <a href="{% url 'accounts:worker_login' %}">Worker login</a>
          <a href="{% url 'accounts:login' %}">Customer login</a>
        {% endif %}
      </nav>
    </header>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              {% block content %}{% endblock %}
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
