{% extends "accounts/login_base.html" %}

{% block title %}Customer login | DeLaundry{% endblock %}

{% block login_content %}
        <h1 class="h3">Customer login</h1>

        <form method="post" action="{% url 'accounts:login' %}">
          {% csrf_token %}

          {% include "accounts/worker_form_fields.html" %}

          <button class="btn btn-primary" type="submit">
            Log in
          </button>
        </form>

        <p class="mt-3 mb-0">
          New to DeLaundry?
          <a href="{% url 'accounts:register' %}">Register as a customer</a>.
        </p>

{% endblock %}
