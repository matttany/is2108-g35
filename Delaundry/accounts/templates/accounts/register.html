{% extends "accounts/base.html" %}

{% block title %}Register | DeLaundry{% endblock %}

{% block content %}

  <form method="post" action="{% url 'accounts:register' %}">
    {% csrf_token %}

    <button type="submit">Register</button>
  </form>
{% endblock %}
