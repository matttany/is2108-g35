{% extends "adminpanel/base.html" %}

{% block title %}Room availability | DeLaundry{% endblock %}

{% block content %}
  <h1>Room availability</h1>
  <p>{{ room }}</p>

  <form method="post" action="{% url 'facilities:room_status' room_id=room.pk %}">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="form-check mb-3">
      {{ form.is_active }}
      <label class="form-check-label" for="{{ form.is_active.id_for_label }}">
        {{ form.is_active.label }}
      </label>
      {{ form.is_active.errors }}
    </div>

    <button class="btn btn-primary" type="submit">
      Save changes
    </button>
    <a class="btn btn-outline-secondary" href="{% url 'facilities:list' %}">
      Cancel
    </a>
  </form>
{% endblock %}
