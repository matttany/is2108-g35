{% extends "adminpanel/base.html" %}
{% block title %}Staff login | DeLaundry{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3">Staff login</h1>
          <p class="text-secondary">Use your staff username and password to manage worker applications.</p>
          <form method="post" action="{% url 'adminpanel:login' %}">
            {% csrf_token %}
            {% include "adminpanel/form_fields.html" %}
            <button class="btn btn-primary" type="submit">Log in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
