<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Staff panel | DeLaundry{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <header class="bg-white border-bottom">
      <nav class="container py-3 d-flex flex-wrap align-items-center gap-3" aria-label="Staff navigation">
        <a class="fs-4 fw-bold text-decoration-none me-auto" href="{% url 'adminpanel:worker_list' %}">DeLaundry staff</a>
        {% if user.is_authenticated and user.is_staff and user.is_active %}
          <a href="{% url 'adminpanel:worker_list' %}">Worker applications</a>
          <span class="text-secondary">{{ user.username }}</span>
          <form method="post" action="{% url 'adminpanel:logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-secondary" type="submit">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'adminpanel:login' %}">Staff login</a>
          <a href="{% url 'accounts:worker_login' %}">Worker login</a>
          <a href="{% url 'accounts:login' %}">Customer login</a>
        {% endif %}
      </nav>
    </header>
    <main class="container py-4">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
